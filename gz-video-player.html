
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local GZ Video Player</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    background: #0c0a17;
    color: #fff;
    font-family: Arial, sans-serif;
  }

  .gz-player {
    width: 100%;
    max-width: 900px;
    margin: 20px auto;
    padding: 20px;
    background: #181818;
    border-radius: 14px;
  }

  .gz-player h2 {
    margin: 0 0 16px;
    font-size: 22px;
  }

  .gz-player .gz-help {
    color: #bbb;
    font-size: 14px;
    line-height: 1.6;
  }

  .gz-player .gz-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 16px 0;
  }

  .gz-player button,
  .gz-player .gz-file-label {
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: #8775f5;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }

  .gz-player button:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .gz-player .gz-file-label {
    display: inline-block;
  }

  .gz-player input[type="file"] {
    display: none;
  }

  .gz-player .gz-status {
    margin: 12px 0;
    color: #c5baff;
    font-size: 14px;
    overflow-wrap: anywhere;
  }

  .gz-player progress {
    display: block;
    width: 100%;
    height: 8px;
    margin: 12px 0;
    accent-color: #8775f5;
  }

  .gz-player video {
    display: block;
    width: 100%;
    max-height: 75vh;
    background: #000;
    border-radius: 8px;
    margin-top: 16px;
  }
</style>
</head>

<body>

<div class="gz-player">
  <h2>Local Video Player</h2>

  <p class="gz-help">
    Choose a .gz, .gzip, Base64 .txt, .mp4, .webm, or other video file
    from your computer. Large files may require substantial RAM.
  </p>

  <div class="gz-actions">
    <label class="gz-file-label" for="gz-file">
      Choose Video File
    </label>
    <input id="gz-file" type="file"
      accept=".gz,.gzip,.txt,.mp4,.webm,.mkv,.mov,.ogv,.ts,video/*">

    <button id="gz-clear" type="button">Clear</button>
  </div>

  <div id="gz-status" class="gz-status" role="status">
    Select a file to begin.
  </div>

  <progress id="gz-progress" value="0" max="100" hidden></progress>

  <video id="gz-video" controls playsinline preload="metadata"></video>
</div>

<script>
(() => {
  const fileInput = document.getElementById("gz-file");
  const video = document.getElementById("gz-video");
  const status = document.getElementById("gz-status");
  const progress = document.getElementById("gz-progress");
  const clearButton = document.getElementById("gz-clear");

  let currentUrl = null;
  let operation = 0;

  function setStatus(message) {
    status.textContent = message;
  }

  function clearPlayer() {
    operation++;

    video.pause();
    video.removeAttribute("src");
    video.load();

    if (currentUrl) {
      URL.revokeObjectURL(currentUrl);
      currentUrl = null;
    }

    fileInput.value = "";
    progress.hidden = true;
    progress.value = 0;
    setStatus("Select a file to begin.");
  }

  function showBlob(blob, message) {
    if (currentUrl) URL.revokeObjectURL(currentUrl);

    currentUrl = URL.createObjectURL(blob);
    video.src = currentUrl;
    video.load();

    setStatus(message + " Use the video controls to play.");
  }

  function isVideoBytes(bytes) {
    if (bytes.length >= 8 &&
        String.fromCharCode(...bytes.slice(4, 8)) === "ftyp") {
      return "video/mp4";
    }

    if (bytes.length >= 4 &&
        bytes[0] === 0x1A && bytes[1] === 0x45 &&
        bytes[2] === 0xDF && bytes[3] === 0xA3) {
      return "video/webm";
    }

    if (bytes.length >= 4 &&
        bytes[0] === 0x4F && bytes[1] === 0x67 &&
        bytes[2] === 0x67 && bytes[3] === 0x53) {
      return "video/ogg";
    }

    if (bytes.length >= 3 &&
        bytes[0] === 0x49 && bytes[1] === 0x44 &&
        bytes[2] === 0x33) {
      return "video/mp4";
    }

    if (bytes.length >= 2 &&
        bytes[0] === 0xFF && (bytes[1] & 0xE0) === 0xE0) {
      return "video/mpeg";
    }

    if (bytes.length >= 188 && bytes[0] === 0x47) {
      return "video/mp2t";
    }

    return null;
  }

  function decodeBase64(text) {
    // Remove whitespace and optional data-URL prefix.
    text = text.trim().replace(/^data:[^,]*;base64,/i, "");
    text = text.replace(/\s/g, "");

    if (!text) throw new Error("The decompressed file is empty.");

    // Support URL-safe Base64.
    text = text.replace(/-/g, "+").replace(/_/g, "/");

    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(text)) {
      throw new Error(
        "The file is not valid Base64 text. Your .gz may contain a different format."
      );
    }

    text = text.replace(/=+$/, "");

    if (text.length % 4 === 1) {
      throw new Error("Invalid Base64 length.");
    }

    text += "=".repeat((4 - text.length % 4) % 4);

    const binary = atob(text);
    const bytes = new Uint8Array(binary.length);

    const chunkSize = 1024 * 1024;
    for (let i = 0; i < binary.length; i += chunkSize) {
      const end = Math.min(i + chunkSize, binary.length);
      for (let j = i; j < end; j++) {
        bytes[j] = binary.charCodeAt(j);
      }
    }

    return bytes;
  }

  async function processFile(file, myOperation) {
    progress.hidden = false;
    progress.value = 0;

    try {
      const name = file.name.toLowerCase();
      setStatus("Reading " + file.name + "...");

      let bytes;
      let mime = file.type || "video/mp4";

      if (name.endsWith(".gz") || name.endsWith(".gzip")) {
        if (!("DecompressionStream" in window)) {
          throw new Error(
            "Your browser does not support GZIP decompression. Please use an updated Chrome or Edge browser."
          );
        }

        setStatus("Decompressing GZIP file...");

        // Read the local file directly. No fetch() or internet URL required.
        const decompressedStream = file.stream().pipeThrough(
          new DecompressionStream("gzip")
        );

        const decompressedBlob = await new Response(
          decompressedStream
        ).blob();

        if (myOperation !== operation) return;

        progress.value = 65;
        setStatus(
          "Decompressed " +
          (decompressedBlob.size / (1024 * 1024)).toFixed(1) +
          " MB. Detecting video format..."
        );

        const header = new Uint8Array(
          await decompressedBlob.slice(0, 512).arrayBuffer()
        );

        if (myOperation !== operation) return;

        mime = isVideoBytes(header);

        if (mime) {
          showBlob(decompressedBlob, "GZIP video ready.");
          progress.value = 100;
          progress.hidden = true;
          return;
        }

        setStatus("Checking whether the decompressed file is Base64 text...");

        const text = await decompressedBlob.text();

        if (myOperation !== operation) return;

        bytes = decodeBase64(text);

      } else if (name.endsWith(".txt")) {
        setStatus("Reading Base64 TXT file...");
        const text = await file.text();

        if (myOperation !== operation) return;

        bytes = decodeBase64(text);

      } else {
        // Ordinary local video.
        showBlob(file, "Video file ready.");
        progress.hidden = true;
        return;
      }

      if (myOperation !== operation) return;

      progress.value = 90;
      setStatus("Creating video...");
      const blob = new Blob([bytes], { type: mime || "video/mp4" });

      showBlob(blob, "Video decoded successfully.");
      progress.value = 100;
      progress.hidden = true;

    } catch (error) {
      if (myOperation !== operation) return;

      progress.hidden = true;
      setStatus("Error: " + (error.message || "Unable to open this file."));
      console.error(error);
    }
  }

  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;

    operation++;

    video.pause();
    video.removeAttribute("src");
    video.load();

    if (currentUrl) {
      URL.revokeObjectURL(currentUrl);
      currentUrl = null;
    }

    processFile(file, operation);
  });

  clearButton.addEventListener("click", clearPlayer);

  video.addEventListener("error", () => {
    if (video.currentSrc) {
      setStatus(
        "The browser could not play this video. The file may use an unsupported codec or may not contain a valid video."
      );
    }
  });
})();
</script>

</body>
</html>
